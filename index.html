<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kodokan Rätselrallye</title>
<style>
  :root{
    --bg-deep: #16202b;
    --bg-panel: #1e2c3a;
    --ember-1: #e8622c;
    --ember-2: #f2a93b;
    --grass: #6fae5b;
    --cream: #f4ece0;
    --cream-dim: #b9c2cc;
    --err: #d9534f;
    --ok: #6fae5b;
    --radius: 18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(ellipse at 50% -10%, #24374a 0%, var(--bg-deep) 55%);
    color: var(--cream);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding: 18px 14px 60px;
  }
  .wrap{ max-width: 480px; margin: 0 auto; }

  /* ---- Header / word progress ---- */
  header{ text-align:center; margin-bottom: 22px; }
  .flame{ font-size: 40px; line-height:1; display:block; margin-bottom: 6px; filter: drop-shadow(0 0 14px rgba(232,98,44,.55)); }
  .flame-logo{ width: 64px; height: 64px; display:block; margin: 0 auto 8px; filter: drop-shadow(0 0 10px rgba(0,0,0,.25)); border-radius: 50%; }
  h1{
    font-size: 22px; font-weight: 800; letter-spacing: 0.2px; margin: 0 0 2px;
    color: var(--cream);
  }
  .subtitle{ color: var(--cream-dim); font-size: 14px; margin: 0; }

  .word-track{ display:flex; justify-content:center; gap:8px; margin: 20px 0 4px; }
  .letter-slot{
    width: 46px; height: 56px; border-radius: 10px;
    display:flex; align-items:center; justify-content:center;
    font-size: 26px; font-weight: 800;
    background: rgba(255,255,255,0.04);
    border: 2px solid rgba(255,255,255,0.14);
    color: var(--cream-dim);
    transition: all .4s ease;
  }
  .letter-slot.filled{
    background: linear-gradient(160deg, var(--ember-2), var(--ember-1));
    color: #1a1005; border-color: transparent;
    box-shadow: 0 4px 16px rgba(232,98,44,.35);
    transform: scale(1.06);
  }
  .team-name{ text-align:center; color: var(--ember-2); font-weight:700; font-size:13px; letter-spacing:.3px; margin-bottom: 18px; }

  /* ---- Station trail ---- */
  .trail{ display:grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
  .station-btn{
    background: var(--bg-panel);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: var(--radius);
    padding: 16px 14px;
    text-align:left;
    color: var(--cream);
    cursor:pointer;
    position:relative;
    display:flex; flex-direction:column; gap:6px;
  }
  .station-btn .icon{ font-size:26px; }
  .station-btn .name{ font-weight:700; font-size:15px; }
  .station-btn .status{ font-size:12px; color: var(--cream-dim); }
  .station-btn.done{ border-color: var(--grass); background: linear-gradient(160deg, rgba(111,174,91,.18), var(--bg-panel)); }
  .station-btn.done .status{ color: var(--grass); font-weight:700; }
  .station-btn:active{ transform: scale(0.97); }

  /* ---- Team number picker ---- */
  .team-number-grid{ display:grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .num-btn{
    padding: 14px 0; border-radius: 10px; border: 2px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.04); color: var(--cream); font-size:18px; font-weight:800; cursor:pointer;
  }
  .num-btn.selected{
    background: linear-gradient(160deg, var(--ember-2), var(--ember-1));
    border-color: transparent; color:#1a1005;
  }

  /* ---- Fixed-route path ---- */
  .path{ display:flex; flex-direction:column; gap: 10px; margin-top: 6px; }
  .path-item{ flex-direction: row; align-items:center; gap: 12px; }
  .path-item .path-num{
    width: 26px; height: 26px; border-radius: 50%; flex-shrink:0;
    background: rgba(255,255,255,0.08); color: var(--cream-dim);
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800;
  }
  .path-item.current{ border-color: var(--ember-2); box-shadow: 0 0 0 2px rgba(242,169,59,.25); }
  .path-item.current .path-num{ background: var(--ember-2); color:#1a1005; }
  .path-item.done .path-num{ background: var(--grass); color:#0d1a08; }
  .path-item.locked{ opacity: 0.45; cursor: default; }
  .path-item.locked:active{ transform:none; }

  /* ---- Station detail ---- */
  .panel{
    background: var(--bg-panel);
    border-radius: var(--radius);
    padding: 20px 18px 22px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .back-btn{
    background:none; border:none; color: var(--cream-dim);
    font-size: 14px; padding: 6px 0 14px; cursor:pointer;
  }
  .step-label{ font-size:12px; text-transform: none; letter-spacing:.3px; color: var(--ember-2); font-weight:700; margin-bottom:6px;}
  .riddle-text{ font-size: 17px; line-height:1.5; margin: 0 0 18px; }
  input[type=text]{
    width:100%; padding: 14px 14px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.05); color: var(--cream); font-size:18px; font-weight:700;
    text-align:center; letter-spacing:1px;
  }
  input[type=text]:focus{ outline:none; border-color: var(--ember-2); }
  .btn{
    display:block; width:100%; margin-top:12px; padding: 14px; border:none; border-radius: 12px;
    background: linear-gradient(160deg, var(--ember-2), var(--ember-1));
    color:#1a1005; font-size:16px; font-weight:800; cursor:pointer;
  }
  .btn:active{ transform: scale(0.98); }
  .btn.secondary{
    background: transparent; color: var(--cream-dim); border: 1px solid rgba(255,255,255,0.16);
    font-weight:600; font-size:14px; padding:10px;
  }
  .feedback{ margin-top:12px; font-weight:700; font-size:14px; min-height: 20px; }
  .feedback.err{ color: var(--err); }
  .feedback.ok{ color: var(--ok); }
  .hint-box{
    margin-top: 14px; background: rgba(255,255,255,0.05); border-left: 3px solid var(--ember-2);
    padding: 10px 12px; border-radius: 8px; font-size: 14px; color: var(--cream-dim);
  }
  .shake{ animation: shake .35s; }
  @keyframes shake{ 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} 100%{transform:translateX(0)} }

  .letter-reveal{ text-align:center; padding: 10px 0 4px; }
  .letter-reveal .big{
    font-size: 64px; font-weight:900; color: var(--ember-2);
    text-shadow: 0 0 24px rgba(242,169,59,.6);
    display:block;
  }

  /* ---- Setup screen ---- */
  .setup input{ margin-bottom: 12px; }

  /* ---- Final screen ---- */
  .final{ text-align:center; padding: 30px 10px; }
  .final .flame{ font-size: 60px; }
  .final h2{ font-size: 24px; margin: 6px 0 8px; }
  .final p{ color: var(--cream-dim); font-size:15px; line-height:1.5; }

  footer{ text-align:center; margin-top: 30px; }
  .leader-toggle{
    background:none; border:none; color: rgba(255,255,255,0.28); font-size: 12px; padding: 8px;
  }

  /* ---- Leader sheet ---- */
  .leader-sheet{ font-size: 14px; line-height:1.55; }
  .leader-sheet h3{ color: var(--ember-2); font-size:15px; margin: 18px 0 4px; }
  .leader-sheet h3:first-child{ margin-top:0; }
  .leader-sheet .kv{ color: var(--cream-dim); }
  .leader-sheet code{ background: rgba(255,255,255,0.08); padding: 1px 6px; border-radius:5px; color: var(--ember-2); font-weight:700; }
  .hidden{ display:none !important; }
</style>
</head>

const TARGET_WORD = STATIONS.map(s => s.letter).join("");

// Feste Laufrouten pro Team-Nummer (zyklische Rotation), damit alle Teams
// an unterschiedlichen Stationen starten und sich nicht stauen.
const STATION_IDS = STATIONS.map(s => s.id);
const ROTATIONS = STATION_IDS.map((_, teamIdx) =>
  STATION_IDS.map((_, i) => STATION_IDS[(i + teamIdx) % STATION_IDS.length])
);

let state = {
  team: localStorage.getItem("feuer_team") || "",
  teamNumber: parseInt(localStorage.getItem("feuer_team_number") || "0", 10),
  progress: JSON.parse(localStorage.getItem("feuer_progress") || "{}"),
  view: "setup",
  currentStation: null,
  stepIndex: 1,
  wrongTries: 0
};

if (state.team && state.teamNumber) state.view = "map";

function save(){
  localStorage.setItem("feuer_team", state.team);
  localStorage.setItem("feuer_team_number", String(state.teamNumber));
  localStorage.setItem("feuer_progress", JSON.stringify(state.progress));
}

function getRoute(){
  const idx = ((state.teamNumber - 1) % ROTATIONS.length + ROTATIONS.length) % ROTATIONS.length;
  return ROTATIONS[idx].map(id => STATIONS.find(s => s.id === id));
}

function normalize(s){ return (s||"").trim().toLowerCase(); }

// ---- GPS / Navigation ----
let geoWatchId = null;

function haversineMeters(lat1, lng1, lat2, lng2){
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function stopGeoWatch(){
  if (geoWatchId !== null && navigator.geolocation) {
    navigator.geolocation.clearWatch(geoWatchId);
    geoWatchId = null;
  }
}

function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
}

function mapsUrl(st){
  const ios = isIOS();
  if (st.lat && st.lng) {
    return ios
      ? `https://maps.apple.com/?daddr=${st.lat},${st.lng}&dirflg=w`
      : `https://www.google.com/maps/dir/?api=1&destination=${st.lat},${st.lng}&travelmode=walking`;
  }
  const query = st.mapsQuery || st.name;
  return ios
    ? `https://maps.apple.com/?q=${encodeURIComponent(query)}`
    : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
}

// ---- Challenge-Timer ----
let timerIntervalId = null;
let timerRemaining = 0;
let timerRunning = false;

function stopTimer(){
  if (timerIntervalId !== null) {
    clearInterval(timerIntervalId);
    timerIntervalId = null;
  }
  timerRunning = false;
}

function formatTime(totalSeconds){
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return `${m}:${s < 10 ? '0' : ''}${s}`;
}

function render(){
  stopGeoWatch();
  stopTimer();
  const app = document.getElementById("app");
  if (state.view === "setup") { app.innerHTML = renderSetup(); attachSetup(); attachFooter(); return; }
  if (state.view === "final") { app.innerHTML = renderFinal(); attachFooter(); return; }
  if (state.view === "arrival") { app.innerHTML = renderArrival(); attachArrival(); attachFooter(); return; }
  if (state.view === "station") { app.innerHTML = renderStation(); attachStation(); attachFooter(); return; }
  app.innerHTML = renderMap(); attachMap(); attachFooter();
}

function renderHeader(){
  const filled = STATIONS.map(s => state.progress[s.id]?.done ? s.letter : "_");
  return `
    <header>
      <img src="${LOGO_DATA_URI}" class="flame-logo" alt="Kodokan Olsberg Logo">
      <h1>Kodokan Rätselrallye</h1>
      <p class="subtitle">Sammelt an jeder Station einen Buchstaben</p>
    </header>
    <div class="word-track">
      ${filled.map(l => `<div class="letter-slot ${l !== '_' ? 'filled' : ''}">${l !== '_' ? l : ''}</div>`).join("")}
    </div>
    ${state.team ? `<div class="team-name">Team ${escapeHtml(state.team)}</div>` : ""}
  `;
}

function renderSetup(){
  return `
    <header>
      <img src="${LOGO_DATA_URI}" class="flame-logo" alt="Kodokan Olsberg Logo">
      <h1>Kodokan Rätselrallye</h1>
      <p class="subtitle">Bevor es losgeht: Wie heißt euer Team und welche Nummer habt ihr?</p>
    </header>
    <div class="panel setup">
      <input type="text" id="team-input" placeholder="Teamname eingeben…" maxlength="24" value="${escapeHtml(state.team)}">
      <p style="font-size:13px; color:var(--cream-dim); margin: 4px 0 8px;">Eure Team-Nummer legt fest, an welcher Station ihr startet:</p>
      <div class="team-number-grid" id="team-number-grid">
        ${STATIONS.map((_, i) => `<button class="num-btn ${state.teamNumber === i + 1 ? 'selected' : ''}" data-num="${i + 1}">${i + 1}</button>`).join("")}
      </div>
      <button class="btn" id="start-btn" style="margin-top:16px;">Los geht's</button>
    </div>
  `;
}

function attachSetup(){
  document.querySelectorAll(".num-btn").forEach(btn => {
    btn.onclick = () => {
      state.teamNumber = parseInt(btn.dataset.num, 10);
      document.querySelectorAll(".num-btn").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
    };
  });
  document.getElementById("start-btn").onclick = () => {
    const val = document.getElementById("team-input").value.trim();
    if (!val) { document.getElementById("team-input").focus(); return; }
    if (!state.teamNumber) { return; }
    state.team = val; save(); state.view = "map"; render();
  };
}

function isRevealed(id){
  return !!(state.progress[id]?.arrived || state.progress[id]?.done);
}

function renderMap(){
  const route = getRoute();
  const doneCount = route.filter(s => state.progress[s.id]?.done).length;
  const currentIdx = route.findIndex(s => !state.progress[s.id]?.done);
  return `
    ${renderHeader()}
    <p style="text-align:center; color:var(--cream-dim); font-size:13px; margin: 0 0 14px;">Eure feste Route (Team-Nummer ${state.teamNumber})</p>
    <div class="path">
      ${route.map((s, i) => {
        const done = state.progress[s.id]?.done;
        const isCurrent = i === currentIdx;
        const locked = !done && !isCurrent;
        const revealed = isRevealed(s.id);
        const icon = revealed ? s.icon : "❓";
        const label = revealed ? s.name : `Station ${i + 1}`;
        return `
        <button class="station-btn path-item ${done ? 'done' : ''} ${isCurrent ? 'current' : ''} ${locked ? 'locked' : ''}" data-id="${s.id}" ${locked ? 'disabled' : ''}>
          <span class="path-num">${i + 1}</span>
          <span class="icon">${icon}</span>
          <span class="name">${label}</span>
          <span class="status">${done ? '✓ Geschafft — ' + s.letter : locked ? '🔒 Noch gesperrt' : 'Jetzt dran'}</span>
        </button>`;
      }).join("")}
    </div>
    ${doneCount === route.length ? `<button class="btn" id="to-final" style="margin-top:18px;">Zum Abschluss →</button>` : ""}
  `;
}

function attachMap(){
  document.querySelectorAll(".station-btn:not([disabled])").forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.id;
      const st = STATIONS.find(s => s.id === id);
      if (state.progress[id]?.done) return;
      state.currentStation = st;
      state.wrongTries = 0;
      if (state.progress[id]?.arrived) {
        state.stepIndex = state.progress[id]?.stepIndex || 1;
        state.view = "station";
      } else {
        state.view = "arrival";
      }
      render();
    };
  });
  const toFinal = document.getElementById("to-final");
  if (toFinal) toFinal.onclick = () => { state.view = "final"; render(); };
}

function renderArrival(){
  const st = state.currentStation;
  const hasCoords = !!(st.lat && st.lng);
  const route = getRoute();
  const routePos = route.findIndex(s => s.id === st.id) + 1;
  return `
    ${renderHeader()}
    <button class="back-btn" id="back-btn">← Übersicht</button>
    <div class="panel">
      <div class="step-label">Navigation</div>
      <p class="riddle-text">Auf zu Station ${routePos} ❓. Navigiert dorthin und startet dann das erste Rätsel.</p>
      <a class="btn" href="${mapsUrl(st)}" target="_blank" rel="noopener" style="text-decoration:none; display:block; text-align:center;">📍 In ${isIOS() ? 'Apple Maps' : 'Google Maps'} navigieren</a>
      <div id="distance-info" style="margin-top:16px; text-align:center; color:var(--cream-dim); font-size:14px;">
        ${hasCoords ? 'Standort wird ermittelt…' : 'Automatische Ankunftserkennung ist für diese Station noch nicht eingerichtet.'}
      </div>
      <button class="btn secondary" id="manual-arrive-btn" style="margin-top:16px;">Ich bin angekommen ✓</button>
    </div>
  `;
}

function attachArrival(){
  const backBtn = document.getElementById("back-btn");
  if (backBtn) backBtn.onclick = () => { state.view = "map"; render(); };

  const st = state.currentStation;
  const manualBtn = document.getElementById("manual-arrive-btn");
  if (manualBtn) manualBtn.onclick = () => confirmArrival();

  if (!(st.lat && st.lng)) return;

  if (!navigator.geolocation) {
    const info = document.getElementById("distance-info");
    if (info) info.textContent = "Dieser Browser unterstützt keine Standortermittlung — bitte manuell bestätigen.";
    return;
  }

  geoWatchId = navigator.geolocation.watchPosition(
    pos => {
      const dist = Math.round(haversineMeters(pos.coords.latitude, pos.coords.longitude, st.lat, st.lng));
      const info = document.getElementById("distance-info");
      if (info) {
        if (dist <= st.radius) {
          info.textContent = "✅ Ihr seid da! Das Rätsel startet gleich…";
          info.style.color = "var(--ok)";
          setTimeout(() => confirmArrival(), 900);
        } else {
          info.textContent = `📍 Noch ca. ${dist} m bis zur Station.`;
          info.style.color = "var(--cream-dim)";
        }
      }
    },
    err => {
      const info = document.getElementById("distance-info");
      if (!info) return;
      if (err.code === 1) {
        info.textContent = "Standortzugriff wurde nicht erlaubt. In den Handy-Einstellungen für diese Seite/Safari den Standortzugriff erlauben, dann Seite neu laden — oder einfach manuell bestätigen.";
      } else if (err.code === 3) {
        info.textContent = "GPS-Signal braucht noch etwas — geht an einen Ort mit freier Sicht zum Himmel, oder bestätigt manuell.";
      } else {
        info.textContent = "Standort konnte nicht ermittelt werden — bestätigt manuell, sobald ihr da seid.";
      }
    },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
  );
}

function confirmArrival(){
  stopGeoWatch();
  const id = state.currentStation.id;
  state.progress[id] = { ...(state.progress[id] || {}), arrived: true, done: false, stepIndex: state.progress[id]?.stepIndex || 1 };
  save();
  state.stepIndex = state.progress[id].stepIndex;
  state.wrongTries = 0;
  state.view = "station";
  render();
}

function renderStation(){
  const st = state.currentStation;
  const idx = state.stepIndex;
  const totalInputSteps = st.steps.length;
  const actionIdx = totalInputSteps + 1;
  const revealIdx = totalInputSteps + 2;
  let body = "";

  if (idx >= 1 && idx <= totalInputSteps) {
    const step = st.steps[idx - 1];
    const labelByType = { find: "Findet den Code", riddle: "Löst das Rätsel", combine: "Baut den Schloss-Code" };
    body = `
      <div class="step-label">Schritt ${idx} von ${totalInputSteps + 1} · ${labelByType[step.type] || 'Weiter'}</div>
      <p class="riddle-text">${step.text}</p>
      <input type="text" id="answer-input" placeholder="Zahl eingeben" inputmode="numeric">
      <button class="btn" id="check-btn">Prüfen</button>
      <div class="feedback" id="feedback"></div>
      ${state.wrongTries >= 2 ? `<div class="hint-box">💡 ${step.hint}</div>` : ""}
    `;
  } else if (idx === actionIdx) {
    if (st.challengeType === "key") {
      body = `
        <div class="step-label">Team-Challenge</div>
        <p class="riddle-text">${st.taskText}</p>
        ${st.timerSeconds ? `
          <div id="timer-display" style="text-align:center; font-size:40px; font-weight:900; color:var(--ember-2); margin: 10px 0;">${formatTime(st.timerSeconds)}</div>
          <button class="btn secondary" id="timer-start-btn">⏱️ Timer starten</button>
        ` : ""}
        <button class="btn" id="confirm-btn" style="margin-top:14px;">${st.confirmLabel}</button>
      `;
    } else {
      const code = st.steps[st.steps.length - 1].answer;
      body = `
        <div class="step-label">Schritt ${idx} von ${totalInputSteps + 1} · Zahlenschloss öffnen</div>
        <p class="riddle-text">Euer Code lautet <strong style="color:var(--ember-2); letter-spacing:2px;">${code}</strong>. Stellt diese Zahl am Zahlenschloss eurer Kiste ein und öffnet sie — der Buchstabe wartet drinnen!</p>
        <button class="btn" id="confirm-btn">Kiste geöffnet ✓</button>
      `;
    }
  } else if (idx === revealIdx) {
    body = `
      <div class="letter-reveal">
        <span class="big">${st.letter}</span>
        <p style="color:var(--cream-dim);">Buchstabe gesammelt!</p>
      </div>
      <button class="btn" id="back-to-map">Zurück zur Übersicht</button>
    `;
  }

  return `
    ${renderHeader()}
    <button class="back-btn" id="back-btn">← Übersicht</button>
    <div class="panel">
      ${body}
    </div>
  `;
}

function attachStation(){
  const backBtn = document.getElementById("back-btn");
  if (backBtn) backBtn.onclick = () => { state.view = "map"; render(); };

  const backToMap = document.getElementById("back-to-map");
  if (backToMap) backToMap.onclick = () => {
    state.progress[state.currentStation.id] = { done: true };
    save();
    state.view = "map";
    render();
  };

  const checkBtn = document.getElementById("check-btn");
  if (checkBtn) {
    const doCheck = () => {
      const input = document.getElementById("answer-input");
      const val = normalize(input.value);
      const step = state.currentStation.steps[state.stepIndex - 1];
      const fb = document.getElementById("feedback");
      if (val === normalize(step.answer)) {
        fb.textContent = "Richtig! Weiter geht's.";
        fb.className = "feedback ok";
        state.wrongTries = 0;
        setTimeout(() => {
          state.stepIndex += 1;
          state.progress[state.currentStation.id] = { done: false, stepIndex: state.stepIndex };
          save();
          render();
        }, 500);
      } else {
        state.wrongTries += 1;
        fb.textContent = "Nicht ganz — versucht es nochmal!";
        fb.className = "feedback err";
        input.classList.add("shake");
        setTimeout(() => input.classList.remove("shake"), 350);
        if (state.wrongTries >= 2) render();
      }
    };
    checkBtn.onclick = doCheck;
    document.getElementById("answer-input").addEventListener("keydown", e => { if (e.key === "Enter") doCheck(); });
  }

  const confirmBtn = document.getElementById("confirm-btn");
  if (confirmBtn) confirmBtn.onclick = () => {
    const revealIdx = state.currentStation.steps.length + 2;
    state.stepIndex = revealIdx;
    state.progress[state.currentStation.id] = { done: false, stepIndex: revealIdx };
    save();
    render();
  };

  const timerStartBtn = document.getElementById("timer-start-btn");
  if (timerStartBtn) {
    timerStartBtn.onclick = () => {
      if (timerRunning) return;
      timerRunning = true;
      timerRemaining = state.currentStation.timerSeconds;
      timerStartBtn.disabled = true;
      timerStartBtn.textContent = "⏱️ Läuft…";
      timerIntervalId = setInterval(() => {
        timerRemaining -= 1;
        const display = document.getElementById("timer-display");
        if (!display) { stopTimer(); return; }
        if (timerRemaining <= 0) {
          display.textContent = "Zeit abgelaufen!";
          display.style.color = "var(--err)";
          stopTimer();
        } else {
          display.textContent = formatTime(timerRemaining);
          if (timerRemaining <= 30) display.style.color = "var(--err)";
        }
      }, 1000);
    };
  }
}

function renderFinal(){
  return `
    <div class="final">
      <img src="${LOGO_DATA_URI}" class="flame-logo" alt="Kodokan Olsberg Logo">
      <h2>Das Wort lautet: ${TARGET_WORD}</h2>
      <p>Ihr habt alle fünf Stationen gemeistert und euch den Ippon geholt! Gut gemacht, Team ${escapeHtml(state.team)}!</p>
      <button class="btn" id="reset-btn" style="margin-top:20px;">Neu starten (anderes Team)</button>
    </div>
  `;
}

function resetApp(){
  localStorage.removeItem("feuer_team");
  localStorage.removeItem("feuer_team_number");
  localStorage.removeItem("feuer_progress");
  state = { team: "", teamNumber: 0, progress: {}, view: "setup", currentStation: null, stepIndex: 1, wrongTries: 0 };
  render();
}

function attachFooter(){
  const app = document.getElementById("app");
  const footer = document.createElement("footer");
  footer.innerHTML = `
    <button class="leader-toggle" id="leader-toggle">Für Betreuer: Vorbereitung &amp; Lösungen</button>
    ${state.view !== "setup" ? `<button class="leader-toggle" id="global-reset-btn">🔄 Team/Nummer zurücksetzen</button>` : ""}
  `;
  app.appendChild(footer);
  document.getElementById("leader-toggle").onclick = showLeaderGate;

  const globalResetBtn = document.getElementById("global-reset-btn");
  if (globalResetBtn) globalResetBtn.onclick = () => {
    const ok = confirm("Team und gesamten Fortschritt auf diesem Gerät wirklich zurücksetzen? Das kann nicht rückgängig gemacht werden.");
    if (ok) resetApp();
  };

  const resetBtn = document.getElementById("reset-btn");
  if (resetBtn) resetBtn.onclick = () => resetApp();
}

const LEADER_PASSWORD = "1982";

function showLeaderGate(){
  const app = document.getElementById("app");
  app.innerHTML = `
    <header>
      <img src="${LOGO_DATA_URI}" class="flame-logo" alt="Kodokan Olsberg Logo">
      <h1>Betreuer-Bereich</h1>
      <p class="subtitle">Nur für Betreuer — bitte Passwort eingeben</p>
    </header>
    <div class="panel">
      <input type="password" id="leader-password-input" placeholder="Passwort" inputmode="numeric">
      <button class="btn" id="leader-password-submit" style="margin-top:12px;">Entsperren</button>
      <div class="feedback err" id="leader-password-feedback"></div>
      <button class="btn secondary" id="leader-gate-back" style="margin-top:12px;">Zurück</button>
    </div>
  `;
  const submit = () => {
    const val = document.getElementById("leader-password-input").value;
    if (val === LEADER_PASSWORD) {
      showLeaderSheet();
    } else {
      const fb = document.getElementById("leader-password-feedback");
      fb.textContent = "Falsches Passwort.";
      document.getElementById("leader-password-input").value = "";
      document.getElementById("leader-password-input").focus();
    }
  };
  document.getElementById("leader-password-submit").onclick = submit;
  document.getElementById("leader-password-input").addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
  document.getElementById("leader-gate-back").onclick = () => render();
}

function showLeaderSheet(){
  const app = document.getElementById("app");
  app.innerHTML = `
    <header>
      <img src="${LOGO_DATA_URI}" class="flame-logo" alt="Kodokan Olsberg Logo">
      <h1>Betreuer-Info</h1>
      <p class="subtitle">Vorbereitung, Lösungswort: ${TARGET_WORD}</p>
    </header>
    <div class="panel leader-sheet">
      <h3>📍 GPS-Koordinaten</h3>
      <p class="kv" style="margin-bottom:10px;">Vor dem Event für jede Station eintragen (im Code bei „lat"/„lng"). Ohne Koordinaten funktioniert nur die manuelle Ankunftsbestätigung — die App läuft aber trotzdem einwandfrei.</p>
      ${STATIONS.map(s => `
        <div class="kv">${s.icon} ${s.name}:</div> ${s.lat && s.lng ? `<code>${s.lat}, ${s.lng}</code> (Radius ${s.radius} m)` : `<span style="color:var(--err);">noch nicht eingetragen</span>`}<br>
      `).join("")}
      <hr style='border:none;border-top:1px solid rgba(255,255,255,0.08);margin:16px 0;'>
      <h3>🔢 Team-Routen (Latin Square)</h3>
      <p class="kv" style="margin-bottom:10px;">Jedes Team wählt beim Start seine Team-Nummer (1–5) und folgt automatisch dieser Reihenfolge — so startet jedes Team woanders und niemand staut sich.</p>
      ${ROTATIONS.map((route, i) => `
        <div class="kv">Team ${i + 1}:</div> ${route.map(id => STATIONS.find(s => s.id === id).name).join(" → ")}<br>
      `).join("")}
      <hr style='border:none;border-top:1px solid rgba(255,255,255,0.08);margin:16px 0;'>
      ${STATIONS.map(s => s.challengeType === "key" ? `
        <h3>${s.icon} ${s.name} — Buchstabe ${s.letter} (🔑 Schlüssel-Challenge)</h3>
        <div class="kv">Team-Aufgabe:</div> ${s.taskText}<br>
        ${s.timerSeconds ? `<div class="kv">Zeitlimit:</div> ${Math.round(s.timerSeconds / 60)} Minuten (Timer in der App, Team startet ihn selbst)<br>` : ""}
        <div class="kv">Kiste/Schloss:</div> ${s.box}
      ` : `
        <h3>${s.icon} ${s.name} — Buchstabe ${s.letter}</h3>
        <div class="kv">Versteck (Code A):</div> ${s.hideA}<br>
        <div class="kv">Kopfrätsel (Code B):</div> ${s.steps[1].text} <span class="kv">→ Lösung:</span> <code>${s.steps[1].answer}</code><br>
        <div class="kv">Codes der Reihe nach:</div>
        ${s.steps.map(st => `<code>${st.answer}</code>`).join(" · ")}<br>
        <div class="kv">Kiste/Schloss:</div> ${s.box}
      `).join("<hr style='border:none;border-top:1px solid rgba(255,255,255,0.08);margin:14px 0;'>")}
      <button class="btn secondary" id="close-leader" style="margin-top:18px;">Zurück zur App</button>
    </div>
  `;
  document.getElementById("close-leader").onclick = () => render();
}

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

render();
</script>
</body>
</html>
